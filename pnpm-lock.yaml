lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.5.4
        version: 5.9.3

  apps/edge:
    dependencies:
      '@cherrytor/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@cherrytor/providers':
        specifier: workspace:*
        version: link:../../packages/providers
      '@cherrytor/schemas':
        specifier: workspace:*
        version: link:../../packages/schemas

  apps/web:
    dependencies:
      '@cherrytor/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@cherrytor/schemas':
        specifier: workspace:*
        version: link:../../packages/schemas

  packages/core:
    dependencies:
      '@cherrytor/schemas':
        specifier: workspace:*
        version: link:../schemas

  packages/providers:
    dependencies:
      '@cherrytor/core':
        specifier: workspace:*
        version: link:../core
      '@cherrytor/schemas':
        specifier: workspace:*
        version: link:../schemas

  packages/schemas: {}

packages:

  typescript@5.9.3:
    resolution: {integrity: sha512-jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw==}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  typescript@5.9.3: {}
